apiVersion: v1
kind: Service
metadata:
  name: postgresql
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "learning-lab.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "learning-lab.selectorLabels" (dict "name" "postgresql" "root" .) | nindent 4 }}
  ports:
    - port: 5432
      targetPort: 5432
  type: ClusterIP
