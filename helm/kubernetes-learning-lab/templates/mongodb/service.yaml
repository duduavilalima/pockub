apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "learning-lab.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "learning-lab.selectorLabels" (dict "name" "mongodb" "root" .) | nindent 4 }}
  ports:
    - port: 27017
      targetPort: 27017
  type: ClusterIP
