apiVersion: v1
kind: Secret
metadata:
  name: postgresql-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "learning-lab.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.postgresql.credentials.username | quote }}
  POSTGRES_PASSWORD: {{ required "postgresql.credentials.password é obrigatório (defina POSTGRES_PASSWORD no .env e use helm/helm-env.sh)" .Values.postgresql.credentials.password | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: product-api-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "learning-lab.labels" . | nindent 4 }}
type: Opaque
stringData:
  DB_USERNAME: {{ .Values.postgresql.credentials.username | quote }}
  DB_PASSWORD: {{ required "postgresql.credentials.password é obrigatório (defina POSTGRES_PASSWORD no .env e use helm/helm-env.sh)" .Values.postgresql.credentials.password | quote }}
