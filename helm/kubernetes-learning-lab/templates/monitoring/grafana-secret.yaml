{{- if .Values.monitoring.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: grafana-secret
  namespace: {{ .Values.monitoring.namespace }}
  labels:
    {{- include "learning-lab.labels" . | nindent 4 }}
type: Opaque
stringData:
  admin-password: {{ required "monitoring.grafana.adminPassword é obrigatório (defina GRAFANA_ADMIN_PASSWORD no .env e use helm/helm-env.sh)" .Values.monitoring.grafana.adminPassword | quote }}
{{- end }}
