{{- if .Values.monitoring.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: grafana-secret
  namespace: {{ .Values.monitoring.namespace }}
  labels:
    {{- include "learning-lab.labels" . | nindent 4 }}
type: Opaque
stringData:
  admin-password: {{ .Values.monitoring.grafana.adminPassword | quote }}
{{- end }}
