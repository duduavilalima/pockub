apiVersion: v1
kind: Service
metadata:
  name: product-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "learning-lab.labels" . | nindent 4 }}
spec:
  type: {{ .Values.productApi.service.type }}
  selector:
    {{- include "learning-lab.selectorLabels" (dict "name" "product-api" "root" .) | nindent 4 }}
  ports:
    - port: {{ .Values.productApi.service.port }}
      targetPort: {{ .Values.productApi.service.targetPort }}
      {{- if eq .Values.productApi.service.type "NodePort" }}
      nodePort: {{ .Values.productApi.nodePort }}
      {{- end }}
