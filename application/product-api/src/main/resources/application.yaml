server:
  forward-headers-strategy: native

spring:
  application:
    name: pockub
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
  mongodb:
    uri: ${MONGO_URI}
  data:
    mongodb:
      auto-index-creation: true   # cria os @Indexed de LogAcesso (default do Spring Data é false)
  threads:
    virtual:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always  # apenas estudo; em produção, when-authorized
  metrics:
    tags:
      application: product-api
